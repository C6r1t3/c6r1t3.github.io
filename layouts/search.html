{{ define "main" }}
<div class="site-layout">
<div class="site-main search-page">
<header class="page-header">
    <h1>{{ .Title }}</h1>
</header>
<div id="searchbox" class="searchbox">
    <input id="searchInput" disabled placeholder="{{ .Params.placeholder | default (printf "%s ↵" .Title) }}"
        aria-label="search" type="search" autocomplete="off" maxlength="64">
    <ul id="searchResults" class="searchResults" aria-label="search results"></ul>
</div>
{{ if eq (len site.RegularPages) 0 }}
<p class="empty-state">New writeups are being prepared.</p>
{{ end }}
<script>
window.addEventListener("load", () => {
    const query = new URLSearchParams(window.location.search).get("q");
    const input = document.getElementById("searchInput");
    if (query && input) {
        input.value = query;
        input.dispatchEvent(new Event("input", { bubbles: true }));
    }
});
</script>
</div>
{{ partial "site_sidebar.html" . }}
</div>
{{ end }}
