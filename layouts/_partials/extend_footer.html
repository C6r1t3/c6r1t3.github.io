{{ with site.Params.music.link }}
<aside class="music-card" id="music-card">
    <div class="music-card__panel" id="music-card-panel">
        {{ with site.Params.music.cover }}
        <img class="music-card__cover" src="{{ . | relURL }}" alt="" width="56" height="56">
        {{ else }}
        <span class="music-card__cover music-card__cover--placeholder" aria-label="Không có ảnh bìa">♫</span>
        {{ end }}
        <div class="music-card__details">
            <span class="music-card__label">Đang nghe</span>
            <strong class="music-card__title">{{ site.Params.music.title }}</strong>
            <span class="music-card__artist">{{ site.Params.music.artist }}</span>
        </div>
        <a class="music-card__link" href="{{ . }}" target="_blank" rel="noopener noreferrer">
            {{ site.Params.music.link_label | default "Nghe trên YouTube" }} <span aria-hidden="true">↗</span>
        </a>
        <button class="music-card__toggle" type="button" aria-expanded="true" aria-controls="music-card-panel" aria-label="Thu gọn thẻ nhạc">−</button>
    </div>
</aside>
<script>
(() => {
    const card = document.querySelector("#music-card");
    const panel = document.querySelector("#music-card-panel");
    const toggle = card && card.querySelector(".music-card__toggle");
    if (!card || !panel || !toggle) {
        return;
    }

    const setCollapsed = (collapsed) => {
        panel.hidden = collapsed;
        toggle.setAttribute("aria-expanded", String(!collapsed));
        toggle.setAttribute("aria-label", collapsed ? "Mở thẻ nhạc" : "Thu gọn thẻ nhạc");
    };

    setCollapsed(window.matchMedia("(max-width: 480px)").matches);
    toggle.addEventListener("click", () => {
        setCollapsed(!panel.hidden);
    });
})();
</script>
{{ end }}
